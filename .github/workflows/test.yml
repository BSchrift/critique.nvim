name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: ${{ matrix.os }}, Neovim ${{ matrix.neovim }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable, nightly] # the oldest supported, the current release, and what's coming
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: tests/run.sh
