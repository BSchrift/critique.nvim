# Publishes each release to LuaRocks, for rocks.nvim and other LuaRocks-based plugin managers.
# Needs a LUAROCKS_API_KEY repository secret (from https://luarocks.org/settings/api-keys); without it, this does nothing.
name: luarocks
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.LUAROCKS_API_KEY != ''
      - uses: nvim-neorocks/luarocks-tag-release@v7
        if: env.LUAROCKS_API_KEY != ''
        with:
          copy_directories: |
            doc
            plugin
            bin
            skills
