# Layout for demo/agent.tape: Claude Code on the left, you in Neovim on the right, captions in the status bar.
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*:RGB'
set -g escape-time 0
set -g status-position bottom
set -g status-style 'bg=#16161d fg=#dcd7ba'
set -g status-left-length 220
set -g status-left '#[fg=#e6c384,bold] #{@caption} '
set -g status-right ''
set -g window-status-format ''
set -g window-status-current-format ''
set -g pane-border-status top
set -g pane-border-style 'fg=#54546d'
set -g pane-active-border-style 'fg=#7e9cd8'
set -g pane-border-format '#[bold] #{?#{==:#{pane_index},0},Agent: Claude Code,You: Neovim} '
set -g @caption ''
